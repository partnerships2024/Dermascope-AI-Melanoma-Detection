<svg width="340" height="110" viewBox="0 0 340 110" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="340" height="110" rx="16" fill="#FFFFFF"/>
  
  <!-- Swirl Orbits Logo -->
  <g transform="translate(15, 10)">
    <ellipse cx="50" cy="45" rx="38" ry="24" stroke="#091D28" stroke-width="3" stroke-dasharray="180 30" transform="rotate(-25 50 45)"/>
    <ellipse cx="50" cy="45" rx="32" ry="18" stroke="#0D9488" stroke-width="2.5" stroke-dasharray="120 20" transform="rotate(-15 50 45)"/>
    <ellipse cx="50" cy="45" rx="26" ry="12" stroke="#38BDF8" stroke-width="2" transform="rotate(-5 50 45)"/>
    
    <!-- Central Badge -->
    <rect x="25" y="33" width="50" height="24" rx="12" fill="#091D28"/>
    <text x="50" y="49" font-family="'Inter', sans-serif" font-size="10" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">ICRI-STE</text>
  </g>
  
  <!-- SciTechEngg Text -->
  <text x="130" y="52" font-family="'Inter', sans-serif" font-size="28" font-weight="800" fill="#2E384D" letter-spacing="-0.5">SciTechEngg</text>
  <text x="130" y="70" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#64748B">International Council for Research &amp; Innovation</text>
  <text x="130" y="84" font-family="'Inter', sans-serif" font-size="9" font-weight="500" fill="#94A3B8">Science Technology &amp; Engineering</text>
</svg>
